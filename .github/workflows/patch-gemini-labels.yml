name: Patch Gemini tutor labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-gemini-labels.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace provider-specific labels
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/TutorSession.jsx')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "reply.model || 'Groq'": "reply.model || 'Gemini'",
              "aiProvider: aiStatus === 'online' ? 'groq' : 'scenario'": "aiProvider: aiStatus === 'online' ? 'gemini' : 'scenario'",
              "'ИИ Groq активен'": "'ИИ Gemini активен'",
              "'Нужен ключ Groq'": "'Нужен ключ Gemini'",
              "message.metadata?.ai?.provider === 'groq'": "message.metadata?.ai?.provider === 'gemini'",
          }
          for old, new in replacements.items():
              if old not in text:
                  print(f'Warning: pattern not found: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patched labels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/TutorSession.jsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Switch tutor UI labels to Gemini"
            git push
          fi
