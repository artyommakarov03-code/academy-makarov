name: Verify community upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-community-upgrade.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --version | tee /tmp/install.log
          npm --version | tee -a /tmp/install.log
          npm install 2>&1 | tee -a /tmp/install.log
      - name: Build application
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log
      - name: Record verification result
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p public
          cat /tmp/install.log > public/community-build-log.txt || true
          printf '\n=== npm run build ===\n' >> public/community-build-log.txt
          cat /tmp/build.log >> public/community-build-log.txt || true
          cat > public/community-build-status.json <<EOF
          {
            "install_outcome": "${INSTALL_OUTCOME}",
            "build_outcome": "${BUILD_OUTCOME}",
            "source_sha": "${SOURCE_SHA}",
            "verified_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/community-build-log.txt public/community-build-status.json
          git commit -m "Record community upgrade verification: ${INSTALL_OUTCOME}/${BUILD_OUTCOME}"
          git push
      - name: Fail on verification error
        if: steps.install.outcome != 'success' || steps.build.outcome != 'success'
        run: exit 1
