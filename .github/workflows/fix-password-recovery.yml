name: Fix password recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-password-recovery.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch recovery flow
        run: |
          python - <<'PY'
          from pathlib import Path

          supabase_path = Path('src/lib/supabase.js')
          supabase_source = supabase_path.read_text(encoding='utf-8')
          old_redirect = "export const appRedirectUrl = () =>\n  `${window.location.origin}${window.location.pathname}`;\n"
          new_redirect = "const PRODUCTION_APP_URL = 'https://artyommakarov03-code.github.io/academy-makarov/';\n\nexport const appRedirectUrl = ({ recovery = false } = {}) =>\n  `${PRODUCTION_APP_URL}${recovery ? '?recovery=1' : ''}`;\n"
          if old_redirect not in supabase_source:
            raise SystemExit('supabase redirect pattern not found')
          supabase_path.write_text(supabase_source.replace(old_redirect, new_redirect, 1), encoding='utf-8')

          auth_path = Path('src/components/AuthScreen.jsx')
          auth_source = auth_path.read_text(encoding='utf-8')
          old_reset = "const { error } = await supabase.auth.resetPasswordForEmail(email.trim(), {\n        redirectTo: appRedirectUrl()\n      });"
          new_reset = "const { error } = await supabase.auth.resetPasswordForEmail(email.trim(), {\n        redirectTo: appRedirectUrl({ recovery: true })\n      });"
          if old_reset not in auth_source:
            raise SystemExit('reset password pattern not found')
          auth_path.write_text(auth_source.replace(old_reset, new_reset, 1), encoding='utf-8')

          app_path = Path('src/AppV2.jsx')
          app_source = app_path.read_text(encoding='utf-8')
          old_state = "const [recoveryMode, setRecoveryMode] = useState(false);"
          new_state = "const [recoveryMode, setRecoveryMode] = useState(() => {\n    const search = new URLSearchParams(window.location.search);\n    return search.get('recovery') === '1' || window.location.hash.includes('type=recovery');\n  });"
          if old_state not in app_source:
            raise SystemExit('recovery state pattern not found')
          app_source = app_source.replace(old_state, new_state, 1)

          old_session = "supabase.auth.getSession().then(({ data }) => { setUser(data.session?.user || null); setLoading(false); });"
          new_session = "supabase.auth.getSession().then(({ data }) => {\n      const sessionUser = data.session?.user || null;\n      setUser(sessionUser);\n      if (sessionUser && new URLSearchParams(window.location.search).get('recovery') === '1') {\n        setRecoveryMode(true);\n      }\n      setLoading(false);\n    });"
          if old_session not in app_source:
            raise SystemExit('getSession pattern not found')
          app_source = app_source.replace(old_session, new_session, 1)
          app_path.write_text(app_source, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/supabase.js src/components/AuthScreen.jsx src/AppV2.jsx
          git commit -m "Fix production password recovery redirect"
          git push
