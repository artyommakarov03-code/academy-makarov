name: Fix auth loading lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-auth-loader.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make auth bootstrap fail-safe
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/AppV2.jsx')
          source = path.read_text(encoding='utf-8')

          start_marker = "  useEffect(() => {\n    supabase.auth.getSession()"
          end_marker = "\n\n  useEffect(() => {\n    if (!user || demoProfile) return;"
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Auth bootstrap block not found')

          replacement = '''  useEffect(() => {
    let mounted = true;
    const loadingTimeout = window.setTimeout(() => {
      if (mounted) setLoading(false);
    }, 5000);

    supabase.auth.getSession()
      .then(({ data, error }) => {
        if (!mounted) return;
        if (error) {
          console.warn('Auth initialization failed:', error.message);
          setUser(null);
          return;
        }
        const sessionUser = data.session?.user || null;
        setUser(sessionUser);
        if (sessionUser && new URLSearchParams(window.location.search).get('recovery') === '1') {
          setRecoveryMode(true);
        }
      })
      .catch((error) => {
        if (!mounted) return;
        console.warn('Auth initialization failed:', error?.message || error);
        setUser(null);
      })
      .finally(() => {
        window.clearTimeout(loadingTimeout);
        if (mounted) setLoading(false);
      });

    const { data: listener } = supabase.auth.onAuthStateChange((event, session) => {
      if (!mounted) return;
      if (event === 'PASSWORD_RECOVERY') setRecoveryMode(true);
      setUser(session?.user || null);
      if (!session) setProfile(null);
      setLoading(false);
    });

    return () => {
      mounted = false;
      window.clearTimeout(loadingTimeout);
      listener.subscription.unsubscribe();
    };
  }, []);'''

          source = source[:start] + replacement + source[end:]
          path.write_text(source, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppV2.jsx
          git commit -m "Prevent infinite auth loading screen"
          git push
