name: Verify experience upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-experience-upgrade.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build application
        id: build
        continue-on-error: true
        run: npm run build

      - name: Record verification result
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p public
          cat > public/upgrade-build-status.json <<EOF
          {
            "outcome": "${BUILD_OUTCOME}",
            "source_sha": "${SOURCE_SHA}",
            "verified_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "node": "20"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/upgrade-build-status.json
          git commit -m "Record experience upgrade build: ${BUILD_OUTCOME}"
          git push

      - name: Fail when build failed
        if: steps.build.outcome != 'success'
        run: exit 1
