name: Cut WH40K batch 002

on:
  push:
    branches: [main]
    paths:
      - 'pixel-dnd-assets/cut-batch-002/_READY'

permissions:
  contents: write

jobs:
  cut-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Cut standalone WebP assets
        run: |
          set -euo pipefail
          python3 .github/scripts/cut_wh40k_batch_002.py
          test "$(find pixel-dnd/assets/warhammer40k/production -maxdepth 1 -name 'wh40k_w1_0*.webp' | wc -l)" -ge 10
          test -f pixel-dnd/data/universes/warhammer40k/cut-report-batch-002.json
      - name: Commit generated assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pixel-dnd .github/scripts/cut_wh40k_batch_002.py .github/workflows/cut-wh40k-batch-002.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Cut 10 standalone WH40K batch 002 assets [skip ci]'
          git push
