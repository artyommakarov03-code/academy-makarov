name: Install Pixel DND

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-pixel-dnd.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Pixel DND sources
        run: |
          cat pixel-dnd-source/chunk-*.b64 > /tmp/pixel-dnd-source.tar.gz.b64
          base64 --decode /tmp/pixel-dnd-source.tar.gz.b64 > /tmp/pixel-dnd-source.tar.gz
          tar -xzf /tmp/pixel-dnd-source.tar.gz
          node --check pixel-dnd/server.mjs
          node --check pixel-dnd/app.js

      - name: Commit installed game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf pixel-dnd-source
          rm -f .github/workflows/install-pixel-dnd.yml
          git add -A
          git commit -m "Install Pixel DND online app"
          git push
