name: Import WH40K assets

on:
  push:
    branches: [main]
    paths:
      - 'pixel-dnd-assets/upload-012-020/_READY'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover validated assets
        run: |
          set -euo pipefail
          python3 .github/scripts/salvage_wh40k_assets.py
          test "$(find pixel-dnd/assets/warhammer40k/production -name '*.webp' | wc -l)" -ge 67
          test -f pixel-dnd/data/universes/warhammer40k/generated-batch-020.json
          test -f pixel-dnd/data/universes/warhammer40k/generated-index.json
          test -f pixel-dnd/data/universes/warhammer40k/salvage-report-012-020.json
      - name: Commit recovered assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pixel-dnd .github/scripts/salvage_wh40k_assets.py .github/workflows/import-wh40k-assets.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Import 67 validated Warhammer assets [skip ci]'
          git push
