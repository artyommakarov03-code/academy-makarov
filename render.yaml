services:
  - type: web
    name: pixel-dnd
    runtime: node
    plan: free
    region: frankfurt
    rootDir: pixel-dnd
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: OPENAI_MAX_OUTPUT_TOKENS
        value: "600"
      - key: DM_RATE_LIMIT
        value: "30"
      - key: NODE_ENV
        value: production
